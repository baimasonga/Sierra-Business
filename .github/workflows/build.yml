name: .NET verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SierraBusiness.sln
      - run: dotnet build SierraBusiness.sln --no-restore --configuration Release
      - run: dotnet test SierraBusiness.sln --no-build --configuration Release --logger trx
      - run: dotnet workload install maui-windows
      - run: dotnet build src/SierraBusiness.Maui/SierraBusiness.Maui.csproj --configuration Release
