name: Windows desktop package
# Release: push a tag vX.Y.Z on a commit of the default branch (or run this workflow by hand). The installer is built, tested on a
# clean Windows machine and only then published as a GitHub release. Pull requests that change packaging get the same build and
# acceptance check as version 0.0.0, never published.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - .github/workflows/windows-package.yml
      - packaging/**
      - scripts/package-windows.ps1
      - scripts/accept-windows-install.ps1
      - src/SierraBusiness.Maui/**
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (major.minor.patch)
        required: true
        default: '0.33.0'
      webview2_url:
        description: Microsoft Evergreen Standalone Installer x64 HTTPS download URL
        required: true
        default: 'https://go.microsoft.com/fwlink/?linkid=2124701'
      publish:
        description: Publish a GitHub release after acceptance passes (default branch only)
        type: boolean
        default: true
      reuse_run:
        description: Re-run only the acceptance check, on the installer built by this earlier run ID (never publishes)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INSTALLER: RokelaBusinessAdmin-Setup-x64.exe
  WEBVIEW2_URL: ${{ inputs.webview2_url || 'https://go.microsoft.com/fwlink/?linkid=2124701' }}

jobs:
  # Decide the version and whether this run may publish. Releases are immutable, so a version that is already released or older
  # than the newest release is refused before an hour is spent building it.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fail in seconds, not after an hour of building, if a packaging or acceptance script does not parse.
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Output "::error file=scripts/$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REUSE_RUN: ${{ inputs.reuse_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) version="$INPUT_VERSION"; publish="$INPUT_PUBLISH" ;;
            push) version="${GITHUB_REF_NAME#v}"; publish=true ;;
            *) version=0.0.0; publish=false ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be major.minor.patch, not '$version'."; exit 1; }
          [ -z "$REUSE_RUN" ] || publish=false
          if [ "$publish" = true ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" \
              || { echo "::error::Only commits on $DEFAULT_BRANCH are released."; exit 1; }
            released=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' || true)
            if printf '%s\n' "$released" | grep -qx "$version"; then echo "::error::Version $version is already released."; exit 1; fi
            newest=$(printf '%s\n' "$released" "$version" | sed '/^$/d' | sort -V | tail -1)
            [ "$newest" = "$version" ] || { echo "::error::Version $version is older than the newest release $newest."; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version; publish: $publish"

  package:
    needs: prepare
    if: inputs.reuse_run == '' || inputs.reuse_run == null
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native build tools
        shell: pwsh
        run: |
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { throw 'MAUI workload installation failed.' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Download offline WebView2 prerequisite
        shell: pwsh
        run: |
          $uri = [Uri]$env:WEBVIEW2_URL
          if ($uri.Scheme -ne 'https') { throw 'An HTTPS download URL is required.' }
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest -Uri $uri -OutFile .tools/WebView2-x64.exe
          # The packaging script requires a valid Microsoft signature and rejects the online bootstrapper.
      - name: Test, publish and compile installer
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION -WebView2Installer .tools/WebView2-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            artifacts/windows/${{ needs.prepare.outputs.version }}/RokelaBusinessAdmin-Setup-x64.exe
            artifacts/windows/${{ needs.prepare.outputs.version }}/SHA256SUMS.txt
            artifacts/windows/${{ needs.prepare.outputs.version }}/tests/tests.trx
          if-no-files-found: error
          retention-days: 30

  # A fresh runner is a clean Windows machine: install, set up, restart, upgrade and uninstall the package there.
  accept:
    needs: [prepare, package]
    if: always() && needs.prepare.result == 'success' && (needs.package.result == 'success' || (inputs.reuse_run != '' && inputs.reuse_run != null && needs.package.result == 'skipped'))
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Fetch the previous release for the upgrade check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = [version]$env:PACKAGE_VERSION
          $previous = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 100 --json tagName | ConvertFrom-Json |
            Where-Object { $_.tagName -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_.tagName.Substring(1) } |
            Where-Object { $_ -lt $current } | Sort-Object -Descending | Select-Object -First 1
          if ($previous) {
            gh release download "v$previous" --repo $env:GITHUB_REPOSITORY --pattern $env:INSTALLER --pattern SHA256SUMS.txt --dir .previous
            if ($LASTEXITCODE -ne 0) { throw "Could not download release v$previous." }
            "PREVIOUS_VERSION=$previous" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else { Write-Output 'No earlier release: the upgrade check reinstalls this version over itself.' }
      - name: Clean-machine acceptance
        shell: pwsh
        run: |
          $arguments = @{ Installer = "dist/$env:INSTALLER"; Version = $env:PACKAGE_VERSION; OutputDirectory = 'acceptance' }
          if ($env:PREVIOUS_VERSION) { $arguments.PreviousInstaller = ".previous/$env:INSTALLER"; $arguments.PreviousVersion = $env:PREVIOUS_VERSION }
          ./scripts/accept-windows-install.ps1 @arguments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: acceptance
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: [prepare, package, accept]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd out
          (cd installer && sha256sum -c SHA256SUMS.txt)
          cp installer/tests/tests.trx test-results.trx
          {
            echo "Windows installer for Rokela Business Admin ${PACKAGE_VERSION}, built from ${GITHUB_SHA::7}."
            echo
            echo "Download **${INSTALLER}**, close Rokela Business Admin if it is open, make a backup, then run the installer. Business data stays in your Windows account and is kept on update and uninstall."
            echo
            echo "The installer is not code-signed yet, so Windows SmartScreen may warn: choose **More info**, then **Run anyway**."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 installer/SHA256SUMS.txt)\`"
            echo
            cat acceptance/acceptance.md
          } > notes.md
          tag="v${PACKAGE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::$tag already exists."; exit 1; fi
          gh release create "$tag" \
            "installer/${INSTALLER}" installer/SHA256SUMS.txt test-results.trx acceptance/acceptance.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Rokela Business Admin ${PACKAGE_VERSION}" --notes-file notes.md
