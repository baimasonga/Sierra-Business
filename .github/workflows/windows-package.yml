name: Windows desktop package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (major.minor.patch)
        required: true
        default: '0.10.0'
      webview2_url:
        description: Microsoft Evergreen Standalone Installer x64 HTTPS download URL
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native build tools
        shell: pwsh
        run: |
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { throw 'MAUI workload installation failed.' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Download offline WebView2 prerequisite
        shell: pwsh
        env:
          WEBVIEW2_URL: ${{ inputs.webview2_url }}
        run: |
          $uri = [Uri]$env:WEBVIEW2_URL
          if ($uri.Scheme -ne 'https') { throw 'An HTTPS download URL is required.' }
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest -Uri $uri -OutFile .tools/WebView2-x64.exe
          # The packaging script requires a valid Microsoft signature and rejects the online bootstrapper.
      - name: Test, publish and compile installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/package-windows.ps1 -Version $env:PACKAGE_VERSION -WebView2Installer .tools/WebView2-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SierraBusiness-Windows-${{ inputs.version }}
          path: |
            artifacts/windows/${{ inputs.version }}/SierraBusiness-Setup-x64.exe
            artifacts/windows/${{ inputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14





